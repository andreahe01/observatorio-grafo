
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xml:lang="es"
      lang="es"
      xmlns:og="http://opengraphprotocol.org/schema/"
      xmlns:fb="http://www.facebook.com/2008/fbml"
      itemscope
      itemtype="http://schema.org/Map">

<head>
  <title>Grafo cultural del Observatorio Ético del Branding</title>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

  <!-- Compatibilidad con Internet Explorer -->
  <!--[if IE]>
  <script type="text/javascript" src="excanvas.js"></script>
  <![endif]-->

  <!-- Scripts del grafo -->
  <script src="jquery.min.js" type="text/javascript"></script>
  <script src="sigma.min.js" type="text/javascript"></script>
  <script src="sigma.parseJson.js" type="text/javascript"></script>
  <script src="jquery.fancybox.pack.js" type="text/javascript"></script>
  <script src="main.js" type="text/javascript"></script>

  <!-- Estilos -->
  <link rel="stylesheet" type="text/css" href="jquery.fancybox.css" />
  <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
  <link rel="stylesheet" media="screen and (max-height: 770px)" href="tablet.css" />
</head>

<body>

  <!-- Área principal de visualización -->
  <div class="sigma-parent">
    <div class="sigma-expand" id="sigma-canvas"></div>
  </div>

  <!-- Panel principal -->
  <div id="mainpanel">

    <div class="col">

      <div id="maintitle"></div>
      <div id="title"></div>
      <div id="titletext"></div>

      <div class="info cf">
        <dl>
          <dt class="moreinformation"></dt>
          <dd class="line">
            <a href="#information" class="line fb">
              Más información sobre esta visualización
            </a>
          </dd>
        </dl>
      </div>

      <!-- Leyenda -->
      <div id="legend">

        <div class="box">

          <h2>Leyenda:</h2>

          <dl>
            <dt class="node"></dt>
            <dd></dd>

            <dt class="edge"></dt>
            <dd></dd>

            <dt class="colours"></dt>
            <dd></dd>
          </dl>

        </div>

      </div>

      <!-- Búsqueda y filtros -->
      <div class="b1">

        <form>

          <div id="search" class="cf">

            <h2>Buscar:</h2>

            <input
              type="text"
              name="search"
              value="Buscar una marca o concepto cultural"
              class="empty"
              aria-label="Buscar una marca o concepto cultural"
            />

            <div class="state"></div>
            <div class="results"></div>

          </div>

          <div class="cf" id="attributeselect">

            <h2>Filtrar por grupo:</h2>

            <div class="select">
              Seleccionar grupo
            </div>

            <div class="list cf"></div>

          </div>

        </form>

      </div>

    </div>

    <!-- Información general -->
    <div id="information">
    </div>

  </div>

  <!-- Controles de zoom -->
  <div id="zoom">

    <div class="z" rel="in"></div>
    <div class="z" rel="out"></div>
    <div class="z" rel="center"></div>

  </div>

  <!-- Licencia -->
  <div id="copyright">

    <a
      rel="license"
      href="http://creativecommons.org/licenses/by-nc-sa/3.0/"
      title="Licencia Creative Commons"
    >
      <img
        alt="Licencia Creative Commons"
        style="border-width:0"
        src="CC.png"
      />
    </a>

  </div>

  <!-- Panel de información de cada nodo -->
  <div id="attributepane">

    <div class="text">

      <div title="Cerrar" class="left-close returntext">

        <div class="c cf">
          <span>Volver a la red completa</span>
        </div>

      </div>

      <div class="headertext">
        <span>Información del nodo</span>
      </div>

      <div class="nodeattributes">

        <div class="name"></div>

        <div class="data"></div>

        <div class="p">
          Conexiones:
        </div>

        <div class="link">
          <ul>
          </ul>
        </div>

      </div>

    </div>

  </div>

</body>
</html>

</script>

</body>

</html>
